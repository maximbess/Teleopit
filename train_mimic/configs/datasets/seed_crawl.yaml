name: seed_only_crawl
target_fps: 30

preprocess:
  min_frames: 22
  normalize_root_xy: true
  ground_align: none
  max_all_off_ground_s: 0.8
  off_ground_height: 0.12

sources:
  - name: crawl_repeat
    type: seed_csv
    input: data/SEED/g1/csv
    metadata_csv: data/SEED/seed_crawl_metadata.csv
    filters: {}