# G1 baseline from unitree_rl_mjlab g1_constants.py (HOME_KEYFRAME).
# Action scale computed as 0.25 * effort_limit / stiffness per actuator.
# Do NOT copy from deploy.yaml (contains known waist_yaw scale error).

num_actions: 29
# Inference uses the 167D velcmd_history observation path (General-Tracking-G1).

kps: [40.2, 99.1, 40.2, 99.1, 28.5, 28.5,
      40.2, 99.1, 40.2, 99.1, 28.5, 28.5,
      40.2, 28.5, 28.5,
      14.3, 14.3, 14.3, 14.3, 14.3, 16.8, 16.8,
      14.3, 14.3, 14.3, 14.3, 14.3, 16.8, 16.8]

kds: [2.6, 6.3, 2.6, 6.3, 1.8, 1.8,
      2.6, 6.3, 2.6, 6.3, 1.8, 1.8,
      2.6, 1.8, 1.8,
      0.9, 0.9, 0.9, 0.9, 0.9, 1.1, 1.1,
      0.9, 0.9, 0.9, 0.9, 0.9, 1.1, 1.1]

default_angles: [-0.312, 0, 0, 0.669, -0.363, 0,
                 -0.312, 0, 0, 0.669, -0.363, 0,
                 0, 0, 0,
                 0.2, 0.2, 0, 0.6, 0, 0, 0,
                 0.2, -0.2, 0, 0.6, 0, 0, 0]

action_scale: [0.5475, 0.3507, 0.5475, 0.3507, 0.4386, 0.4386,
               0.5475, 0.3507, 0.5475, 0.3507, 0.4386, 0.4386,
               0.5475, 0.4386, 0.4386,
               0.4386, 0.4386, 0.4386, 0.4386, 0.4386, 0.0745, 0.0745,
               0.4386, 0.4386, 0.4386, 0.4386, 0.4386, 0.0745, 0.0745]

torque_limits: [88, 139, 88, 139, 50, 50,
                88, 139, 88, 139, 50, 50,
                88, 50, 50,
                25, 25, 25, 25, 25, 5, 5,
                25, 25, 25, 25, 25, 5, 5]

sim_dt: 0.005

# MuJoCo solver settings (match mjlab training)
solver: "newton"
integrator: "implicitfast"
solver_iterations: 10
ls_iterations: 20

# Use built-in PD actuators matching mjlab training
builtin_pd: true

xml_path: "assets/robots/unitree_g1/g1_29dof.xml"
base_body: "pelvis"

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
ankle_idx: [4, 5, 10, 11]

mujoco_default_qpos: [0, 0, 0.76,
                      1, 0, 0, 0,
                      -0.312, 0, 0, 0.669, -0.363, 0,
                      -0.312, 0, 0, 0.669, -0.363, 0,
                      0, 0, 0,
                      0.2, 0.2, 0, 0.6, 0, 0, 0,
                      0.2, -0.2, 0, 0.6, 0, 0, 0]

grip:
  enabled: true

  # true: both hands are armed after every robot.reset().
  # false: call robot.grip.request_attach("left" | "right") explicitly.
  auto_attach: true

  # Extra distance outside the capsule-site surface.  The generated ladder
  # already uses grip radius = rung radius + 0.04 m, so no extra margin is
  # needed here.
  attach_distance: 0.0
  max_hand_speed: 0.25

  left_hand_site: "left_grip_site"
  right_hand_site: "right_grip_site"

  left_anchor_body: "left_grip_anchor_body"
  right_anchor_body: "right_grip_anchor_body"
  left_anchor_site: "left_grip_anchor"
  right_anchor_site: "right_grip_anchor"

  left_weld: "left_grip_weld"
  right_weld: "right_grip_weld"

  rung_site_pattern: ".*_ladder_rung_[0-9]+_grip"
  parking_position: [0.0, 0.0, -1.0]
