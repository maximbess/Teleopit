[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teleopit"
version = "0.4.0"
description = "Teleoperation framework for humanoid robots with motion retargeting"
authors = [
    {name = "Teleopit Team"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "mujoco",
    "mink",
    "qpsolvers",
    "torch",
    "scipy",
    "numpy",
    "hydra-core",
    "omegaconf",
    "h5py",
    "onnxruntime",
    "pyzmq",
    "rich",
    "loop-rate-limiters",
    "imageio",
    "huggingface_hub",
]

[project.optional-dependencies]
collision-build = [
    "trimesh==5.1.0",
    "coacd==1.0.14",
    "shapely==2.1.2",
]
dev = [
    "pytest",
    "pytest-cov",
]
sim2real = [
    "opencv-python",
    # Also requires g1_bridge_sdk (C++ DDS bridge):
    #   bash scripts/setup/setup_g1_bridge.sh
]
train = [
    # CUDA 11.8 wheels run on drivers that only advertise CUDA 12.4.
    # The default PyPI wheel is a CUDA 13 build and leaves torch.cuda unavailable there.
    "torch @ https://download.pytorch.org/whl/cu118/torch-2.7.1%2Bcu118-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version == '3.10' and platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torch @ https://download.pytorch.org/whl/cu118/torch-2.7.1%2Bcu118-cp311-cp311-manylinux_2_28_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torch @ https://download.pytorch.org/whl/cu118/torch-2.7.1%2Bcu118-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version == '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torch @ https://download.pytorch.org/whl/cu118/torch-2.7.1%2Bcu118-cp313-cp313-manylinux_2_28_x86_64.whl ; python_version == '3.13' and platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torch==2.7.1 ; platform_system != 'Linux' or platform_machine != 'x86_64' or python_version >= '3.14'",
    "numpy>=1.20.0",
    "rsl-rl-lib==5.2.0",
    "mjlab==1.4.0",
    "warp-lang==1.15.0",
    "wandb>=0.22.3",
    "swanlab",
    "tqdm>=4.65.0",
]
pico4 = [
    "pico-bridge[camera] @ https://github.com/BotRunner64/pico-bridge/releases/download/v0.2.1/pico_bridge-0.2.1-py3-none-any.whl",
    "teleopit[sim2real]",
]
recording = [
    "teleopit[pico4]",
    "opencv-python",
    "imageio[ffmpeg]",
]
dexhand = []

[tool.setuptools.packages.find]
where = ["."]
include = ["teleopit*", "train_mimic*"]
[tool.pytest.ini_options]
pythonpath = ["."]
